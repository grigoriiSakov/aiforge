_templates_suffix: .jinja
_answers_file: .copier-answers.yml

project_slug:
  type: str
  help: Project slug

project_name:
  type: str
  help: Human-readable project name

main_branch:
  type: str
  default: dev

workflow_tracker:
  type: str
  default: linear
  choices:
    - linear
    - gitlab
    - github
    - none

workflow_language:
  type: str
  default: ru

tracker_status_plan_ready:
  type: str
  default: Todo

tracker_status_active:
  type: str
  default: In Progress

tracker_status_review:
  type: str
  default: In Review

profile_id:
  type: str
  default: python-fastapi-docker
  choices:
    - python-fastapi-docker
    - laravel-docker
    - vue-quasar-capacitor

enable_cursor:
  type: bool
  default: true

enable_codex:
  type: bool
  default: true

enable_claude:
  type: bool
  default: true

enable_agent:
  type: bool
  default: true

enable_agents:
  type: bool
  default: true

orchestrator_worktree_root:
  type: str
  default: ~/worktrees/project

orchestrator_branch_prefix:
  type: str
  default: agent/

orchestrator_max_review_iterations:
  type: int
  default: 3

plan_progress_runtime_root:
  type: str
  default: .ai/context/runtime
  help: Directory (repo-relative) under which each ISSUE-ID gets plan.md and progress.md

manifesto_title:
  type: str
  default: Project Workflow Manifesto

manifesto_path:
  type: str
  default: MANIFESTO.md

llms_root_dir:
  type: str
  default: llms

llms_txt_path:
  type: str
  default: llms.txt

llms_source_globs:
  type: yaml
  default: []

task_command:
  type: str
  default: .ai/bin/go-task

task_implement_name:
  type: str
  default: implement

task_test_name:
  type: str
  default: test

task_lint_name:
  type: str
  default: lint

task_verify_name:
  type: str
  default: verify

task_review_name:
  type: str
  default: review

execution_canonical_root:
  type: str
  default: .

execution_worktree_env_var:
  type: str
  default: AIFORGE_WORKTREE_PATH

execution_worktree_strategy:
  type: str
  default: direct

execution_implement_entrypoint:
  type: str
  default: .ai/bin/go-task implement

execution_test_entrypoint:
  type: str
  default: .ai/bin/go-task test

execution_lint_entrypoint:
  type: str
  default: .ai/bin/go-task lint

execution_verify_entrypoint:
  type: str
  default: .ai/bin/go-task verify

execution_review_entrypoint:
  type: str
  default: .ai/bin/go-task review

commands:
  type: yaml
  default:
    implement: []
    test: []
    lint: []
    verify: []
    review: []

profile_notes:
  type: yaml
  default: []

mcp_placeholders:
  type: yaml
  default: []

project_rules_markdown:
  type: str
  default: ""

agents_markdown:
  type: str
  default: ""
